name: checks

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the owner's machines already passed for this exact commit (`ci-local`, ci/local.json): a status
  # `local/<platform>/<job>` posted by the repository's owner stands in for the same job here.
  local:
    uses: schiffy91/ci-local/.github/workflows/local-passes.yml@46bebec22a3affc1be02f115640488afdbbcf31a
    permissions:
      statuses: read

  checks:
    needs: local
    if: ${{ !contains(fromJSON(needs.local.outputs.passed), 'local/linux-x86_64/checks') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            extra-substituters = ${{ vars.SEMU_CACHE_URL }}
            extra-trusted-public-keys = ${{ vars.SEMU_CACHE_PUBLIC_KEY }}
      - name: run every check
        run: ci/checks.sh
