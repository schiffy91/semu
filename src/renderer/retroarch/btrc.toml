manifest-version = 1

[package]
name = "semu_retroarch_bridge"

# RetroArch transpiles this directory on its own, so the renderer ABI binding
# lives here rather than in the renderer package manifest.

[[native.bindings]]
module = "runtime_bridge"
header = "semu_render_abi.h"
language = "c"
standard = "c11"
symbols = [
	"SEMU_RENDER_ABI_GL",
	"SEMU_RENDER_APPLIED",
	"SEMU_RENDER_ASSET_MISSING",
	"SEMU_RENDER_GL_UNAVAILABLE",
	"SEMU_RENDER_INVALID_FRAME",
	"SEMU_RENDER_LAYOUT_AUTO",
	"SEMU_RENDER_LAYOUT_DEFAULT",
	"SEMU_RENDER_LAYOUT_VARIANT_B",
	"SEMU_RENDER_LAYOUT_VARIANT_C",
	"SEMU_RENDER_LAYOUT_VARIANT_D",
	"SEMU_RENDER_MAX_SURFACES",
	"SEMU_RENDER_NO_CONTEXT",
	"SEMU_RENDER_ORIGIN_BOTTOM_LEFT",
	"SEMU_RENDER_ORIGIN_TOP_LEFT",
	"SEMU_RENDER_PASSTHROUGH",
	"SEMU_RENDER_PIPELINE_FAILED",
	"SEMU_RENDER_POINTER_INVALID",
	"SEMU_RENDER_POINTER_MAPPED",
	"SEMU_RENDER_POINTER_OUTSIDE",
	"SEMU_RENDER_POINTER_STALE",
	"SEMU_RENDER_POINTER_UNAVAILABLE"
]

